sentence=Meltybrain combat robot control: drive logic and an accelerometer + magnetometer heading estimator, with complete Rotini V3 and V4 firmware as the examples.
paragraph=MeltyDrive turns the sticks and a heading into motor powers; HeadingEstimator fuses a high-g accelerometer with a magnetometer into that heading. Both are board-agnostic. The Rotini V4 example (ESP32-S3, H3LIS331, MMC5983MA, AM32 ESCs over DShot, CRSF receiver) is the reference firmware; the Rotini V3 example is the same on the V3 board with OneShot125 ESCs.
category=Device Control
