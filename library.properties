sentence=Meltybrain combat robot control: drive logic, accelerometer + magnetometer heading, and support for the Rotini V4 board.
paragraph=MeltyDrive turns the sticks and a heading into motor powers, HeadingEstimator fuses a high-g accelerometer with a magnetometer into that heading, and RotiniV4 runs the Rotini V4 board (ESP32-S3, H3LIS331, MMC5983MA, AM32 ESCs over DShot, CRSF receiver). Rotini V3 is supported by version 1.
